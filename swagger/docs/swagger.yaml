basePath: /api/v1
definitions:
  main.ErrorResponse:
    description: 接口错误时的返回信息
    properties:
      code:
        example: 400
        type: integer
      message:
        example: 请求参数错误
        type: string
    type: object
  main.User:
    description: 用户基本信息
    properties:
      age:
        description: 用户年龄
        example: 25
        type: integer
      email:
        description: 用户邮箱
        example: zhangsan@example.com
        type: string
      id:
        description: 用户ID
        example: 1
        type: integer
      username:
        description: 用户名
        example: zhangsan
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://example.com/support
  description: 接口错误时的返回信息
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://example.com/terms/
  title: 用户管理API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
      - application/json
      description: 创建新的用户
      parameters:
      - description: 用户信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/main.User'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/main.User'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 创建用户
      tags:
      - 用户相关
  /users/{id}:
    get:
      consumes:
      - application/json
      description: 根据用户ID获取用户信息
      parameters:
      - description: 用户ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 认证Token
        in: header
        name: x-token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.User'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: 未找到用户
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      summary: 获取指定用户信息
      tags:
      - 用户相关
schemes:
- http
- https
swagger: "2.0"
