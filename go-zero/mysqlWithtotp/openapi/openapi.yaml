openapi: 3.0.3
info:
  title: mysqlWithtotp 用户与 2FA API
  description: |
    go-zero 示例：用户名密码 + TOTP 二次验证。
    - 需在 Apifox 中配置环境变量：`baseUrl`（如 http://127.0.0.1:8888）、`token`（登录后 Bearer）。
    - 带锁图标的接口需要 Header：`Authorization: Bearer {{token}}`
  version: "1.0.0"

servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://127.0.0.1:8888
        description: 与 etc/mysql-api.yaml 中 Port 一致

tags:
  - name: 用户认证
    description: 注册、登录
  - name: TOTP / 2FA
    description: 绑定 TOTP、二次验证登录、关闭 2FA

paths:
  /api/users/register:
    post:
      tags: [用户认证]
      summary: 注册
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterReq"
            example:
              username: demo
              password: Passw0rd!
      responses:
        "200":
          description: 成功（go-zero 成功时返回 JSON 体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResp"

  /api/users/login:
    post:
      tags: [用户认证]
      summary: 登录（第一步：用户名密码）
      description: |
        - 若未启用 2FA：返回 accessToken。
        - 若已启用 2FA：返回 need2fa=true 与 challengeToken，第二步调用 /api/users/2fa/verify。
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginReq"
      responses:
        "200":
          description: LoginResp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResp"

  /api/users/2fa/totp/enroll/start:
    post:
      tags: [TOTP / 2FA]
      summary: 开始绑定 TOTP
      security:
        - bearerAuth: []
      operationId: totpEnrollStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyReq"
            example: {}
      responses:
        "200":
          description: TotpEnrollStartResp（含 otpauthUrl、前端可用的 qrCodeDataUrl）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollStartResp"

  /api/users/2fa/totp/enroll/confirm:
    post:
      tags: [TOTP / 2FA]
      summary: 确认绑定 TOTP（输入认证器首次 6 位码）
      security:
        - bearerAuth: []
      operationId: totpEnrollConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeReq"
            example:
              code: "123456"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpToggleResp"

  /api/users/2fa/verify:
    post:
      tags: [TOTP / 2FA]
      summary: 登录第二步（提交 TOTP 换正式令牌）
      description: 无需 Bearer；body 中为 login 返回的 challengeToken 与动态码。
      operationId: totpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpVerifyReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpVerifyResp"

  /api/users/2fa/totp/disable:
    post:
      tags: [TOTP / 2FA]
      summary: 关闭 TOTP（需密码 + 当前动态码）
      security:
        - bearerAuth: []
      operationId: totpDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Disable2FAReq"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpToggleResp"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 填写登录或 2FA 验证成功后返回的 accessToken

  schemas:
    RegisterReq:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterResp:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

    LoginReq:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResp:
      type: object
      properties:
        need2fa:
          type: boolean
        challengeToken:
          type: string
        accessToken:
          type: string
        accessExpire:
          type: integer
          format: int64

    EmptyReq:
      type: object
      additionalProperties: false

    TotpEnrollStartResp:
      type: object
      properties:
        issuer:
          type: string
        accountName:
          type: string
        otpauthUrl:
          type: string
        qrCodeDataUrl:
          type: string
          description: data:image/png;base64,... 可直接绑定到前端 img src

    TotpCodeReq:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6 位动态码

    TotpToggleResp:
      type: object
      properties:
        enabled:
          type: boolean

    TotpVerifyReq:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string

    TotpVerifyResp:
      type: object
      properties:
        accessToken:
          type: string
        accessExpire:
          type: integer
          format: int64

    Disable2FAReq:
      type: object
      required: [password, code]
      properties:
        password:
          type: string
        code:
          type: string
