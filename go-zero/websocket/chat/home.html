<!DOCTYPE html>
<html lang="en">
<head>
<title>Chat Example</title>
<script type="text/javascript">
window.onload = function () {
    var conn;
    var msg = document.getElementById("msg");
    var roomId = document.getElementById("roomId");
    var token = document.getElementById("token");
    var roomPassword = document.getElementById("roomPassword");
    var log = document.getElementById("log");
    var status = document.getElementById("status");

    function appendLog(item) {
        var doScroll = log.scrollTop > log.scrollHeight - log.clientHeight - 1;
        log.appendChild(item);
        if (doScroll) {
            log.scrollTop = log.scrollHeight - log.clientHeight;
        }
    }

    function setStatus(text) {
        status.innerText = text;
    }

    function joinPrivateRoom(cb) {
        if (!roomPassword.value) {
            cb();
            return;
        }
        fetch("/rooms/" + encodeURIComponent(roomId.value) + "/join?token=" + encodeURIComponent(token.value), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: roomPassword.value })
        }).then(function (resp) {
            if (!resp.ok) {
                return resp.text().then(function (t) { throw new Error(t || "join failed"); });
            }
            return resp.json();
        }).then(function () {
            setStatus("Private room joined.");
            cb();
        }).catch(function (err) {
            setStatus("Join failed: " + err.message);
        });
    }

    document.getElementById("connectForm").onsubmit = function () {
        if (!window["WebSocket"]) {
            setStatus("Your browser does not support WebSockets.");
            return false;
        }
        if (!roomId.value || !token.value) {
            setStatus("roomId and token are required.");
            return false;
        }

        joinPrivateRoom(function () {
            if (conn) {
                conn.close();
            }
            conn = new WebSocket("ws://" + document.location.host + "/ws?roomId=" + encodeURIComponent(roomId.value) + "&token=" + encodeURIComponent(token.value));
            conn.onopen = function () {
                setStatus("Connected.");
            };
            conn.onclose = function () {
                setStatus("Connection closed.");
            };
            conn.onmessage = function (evt) {
                var item = document.createElement("div");
                try {
                    var data = JSON.parse(evt.data);
                    item.innerText = "[" + data.roomId + "] " + data.nickname + ": " + data.content + " (" + data.createdAt + ")";
                } catch (e) {
                    item.innerText = evt.data;
                }
                appendLog(item);
            };
        });
        return false;
    };

    document.getElementById("form").onsubmit = function () {
        if (!conn) {
            setStatus("Connect first.");
            return false;
        }
        if (!msg.value) {
            return false;
        }
        conn.send(JSON.stringify({
            type: "message",
            content: msg.value
        }));
        msg.value = "";
        return false;
    };
};
</script>
<style type="text/css">
html {
    overflow: hidden;
}

body {
    overflow: hidden;
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
    background: gray;
}

#log {
    background: white;
    margin: 0;
    padding: 0.5em 0.5em 0.5em 0.5em;
    position: absolute;
    top: 0.5em;
    left: 0.5em;
    right: 0.5em;
    bottom: 3em;
    overflow: auto;
}

#form {
    padding: 0 0.5em 0 0.5em;
    margin: 0;
    position: absolute;
    bottom: 1em;
    left: 0px;
    width: 100%;
    overflow: hidden;
}

#connectForm {
    padding: 0.5em;
    margin: 0;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    background: #f0f0f0;
    box-sizing: border-box;
}

#log {
    top: 4.2em;
}

#status {
    margin-left: 1em;
    font-size: 12px;
    color: #333;
}

</style>
</head>
<body>
<form id="connectForm">
    Room: <input type="text" id="roomId" value="public-room" />
    Token: <input type="text" id="token" size="40" />
    Password: <input type="password" id="roomPassword" size="16" placeholder="private room only" />
    <input type="submit" value="Connect" />
    <span id="status">Not connected.</span>
</form>
<div id="log"></div>
<form id="form">
    <input type="submit" value="Send" />
    <input type="text" id="msg" size="64" autofocus />
</form>
</body>
</html>
