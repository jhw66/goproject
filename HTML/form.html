<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
input[type="text"],
input[type="email"] {
  border: 2px solid #000;
  margin: 0 0 1em 0;  
  padding: 10px;
  width: 80%;
}

input[type="submit"] {
  border: 3px solid #333;
  background-color: #999;
  border-radius: 5px;
  padding: 10px 2em;
  font-weight: bold;
  color: #fff;
}

input[type="submit"]:hover,
input[type="submit"]:focus {
  background-color: #333;
}
    </style>
</head>
<body>
    <form>
  <div><label for="name">Name：</label> <input id="name" type="text" /></div>
  <div><label for="email">Email：</label> <input id="email" type="email" /></div>

  <div class="buttons"><input type="submit" value="Submit" /></div>

    <label for="comments">其他备注：</label>
    <textarea id="comments" name="comments" rows="5" cols="33"></textarea></form>
</body>
</html>
