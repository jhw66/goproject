<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        .box01 {
  padding: 0.3em;
  background-color: #567895;
  border: #ea6411 double 3px;
}

h2 {
    background-color: black;
    color: white;
    border: #ea6411 double 3px;
}
span {
  background-color: rgb(255 255 255 / 50%);
    border: #ea6411 double 3px;
}

.wrapper {
  display: flex;
}

.box02 {
  width: 200px;
  height: 80px;
  padding: 0.5em;
  border: 1px solid #f81616;
  margin: 20px;
}

.a {
  background-image: url(https://mdn.github.io/shared-assets/images/examples/balloons.jpg);
  background-color: #ea6411;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

.b {
  background-image: url(https://mdn.github.io/shared-assets/images/examples/star.png);
    background-color: #ea6411;
    background-repeat: repeat-y;
}

.wrapper2 {
  display: flex;
}

.box03 {
  width: 400px;
  height: 80px;
  padding: 0.5em;
  border: 1px solid #ccc;
  margin: 20px;
}

.a02 {
  background-image: linear-gradient(
    105deg,
    rgb(0 249 255 / 100%) 39%,
    rgb(51 56 57 / 100%) 96%
 
  );
}

.b02 {
  background-image: radial-gradient(
    circle,
    rgb(0 249 255 / 100%) 39%,
    rgb(51 56 57 / 100%) 96%
 
  );
  background-size: 100px 50px;
  /* background-repeat: no-repeat; */
}

.wrapper3 {
  display: flex;
}

.box04 {
  width: 500px;
  height: 80px;
  padding: 0.5em;
  border: 1px solid #ccc;
  margin: 20px;
}

.box04 {
  background-image:
    url(https://mdn.github.io/shared-assets/images/examples/big-star.png),
    url(https://mdn.github.io/shared-assets/images/examples/star.png)
}


    </style>
</head>
<body>
    <div class="box01">
  <h2>背景颜色</h2>
  <p>尝试修改背景<span>颜色</span>。</p>
</div>

  <div class="wrapper">
  <div class="box02 a"></div>
  <div class="box02 b"></div>
</div>

  <div class="wrapper2">
  <div class="box03 a02"></div>
  <div class="box03 b02"></div>
</div>

<div class="wrapper3">
  <div class="box04"></div>
</div>




</div>
</body>
</html>
