<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格的增删改查</title>
    <style>
        td {
            padding: 8px;
            font-family: Kaiti;
        }
        td:nth-child(odd):hover {
            background-color:bisque;
        }
        td:nth-child(even):hover {
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    
    <h1 style="text-align: center;">表格的增删改查</h1>
    <button onclick='addRow()'>新增数据</button>
    <table id="table" border="1" style="width: 100%; text-align: center;border-collapse: collapse;margin-top: 20px">
        <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>操作</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Alice</td>
            <td>25</td>
            <td>
                <button onclick="editRow(this)">编辑</button>
                <button onclick="deleteRow(this)">删除</button>
            </td>
        </tr>
        <tr>
            <td>2</td>
            <td>Bob</td>
            <td>30</td>
            <td>
                <button onclick="editRow(this)">编辑</button>
                <button onclick="deleteRow(this)">删除</button>
            </td>
        </tr>
        <script src="./table.js">
            
        </script>
</body>
</html>
