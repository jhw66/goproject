<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS基础语法</title>
    <script type="module" src="./myscript.js"></script>
</head>  
<body>
    <button>hello world</button>

    <script>
        console.log("Hello,我是内联脚本body部分");
        alert("欢迎来到JS世界！");
    </script>

    <script src="./myscript.js"></script>

    <script>
        var x;
        let y=5;
        const z = 10;
        const result = undefined??((""||"默认文本")&&"文本")
        console.log(
            "x的值是:"+x+
            ",\ny的值是:"+y+
            ",\nz的值是:"+z+
            // ",\nm1的值是:"+m1+
            ",\nm2的值是:"+m2+
            ",\nresuly的值是:"+result
        );
        let m1=2;
        var m2=2;
        const record = {
            title: "校园卡",
            status: "open"
        };
        record.status = "closed"; // 可以
        // record = {}; // 不可以

        let time=12;
        if(time<10){
            alert("早上好");
        }
        else if(time<20){
            alert("下午好");
        }
        else{
            alert("晚上好");
        }

        for(let i=0;i<5;i++){
            console.log("当前是第"+i+"次循环");
        }

        while(true){
            console.log("y的值是:"+y);
            y++;
            if(y>7){
                break;
            }
        }
    </script>

    <script>
        function showMessage(){
            alert("这是一个函数调用的示例！");
        }
        showMessage();
    </script>
</body>
</html>
